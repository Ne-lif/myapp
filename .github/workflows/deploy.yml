name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ secrets.APP_PORT }}
          APP_SECRET=${{ secrets.APP_SECRET }}
          API_KEY=${{ secrets.API_KEY }}
          EOF
          echo ".env file created!"

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d
          sleep 10
          docker compose ps

      - name: Verify containers are running
        run: |
          if docker compose ps | grep -q "Up"; then
            echo "All containers are running"
          else
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Simple Application Test
        run: |
          echo "Testing if Nginx is responding on port ${{ secrets.APP_PORT }}..."
          if curl -f http://localhost:${{ secrets.APP_PORT }}; then
            echo "Web server is up and running!"
          else
            echo "Web server test failed"
            exit 1
          fi

      - name: Save artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            .env
            docker-compose.yml
          retention-days: 30
